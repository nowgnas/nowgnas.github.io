---
layout: page
# The tag archive layout
---

{% include lang.html %}

<div id="page-tag" class="taxonomy-page">
  <header class="taxonomy-header">
    <a class="taxonomy-eyebrow" href="{{ '/tags/' | relative_url }}">태그</a>
    <h1 class="taxonomy-title">#{{ page.title }}</h1>
    <p class="taxonomy-count">{{ page.posts | size }}개의 글</p>
  </header>

  <div id="post-list">
    {% for post in page.posts %}
      {% include post-list-item.html post=post lang=lang show_category=true %}
    {% endfor %}
  </div>
</div>
