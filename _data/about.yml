intro:
  name: 이상원 · Sangwon Lee
  headline: 대량 트래픽 속에서 데이터 정합성과 조회 성능을 함께 지키는 백엔드 엔지니어
  summary:
    - 롯데ON 회원/마이롯데 모듈에서 Kafka와 CDC 기반 비동기 처리, 재처리 구조로 장애 이후의 데이터를 복구하고, 집계 테이블과 캐시 구조로 조회 부하를 줄여왔습니다.
    - 운영 문제를 지표로 정의하고, 장애 영향은 줄이면서 점진적으로 구조를 개선합니다.
